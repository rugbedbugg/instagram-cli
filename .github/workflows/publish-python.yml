# UPSTREAM-ONLY: publishes the legacy Python client to PyPI from upstream's pypi-release environment.
# Kept for reference in the maintenance fork. The repository guard below makes the job skip
# in any other repository, so v*.*.* tags in the fork cannot trigger a PyPI publish.
name: Build and Publish Python Package

on:
  push:
    tags:
      - 'v*.*.*'
      - '!ts-v*.*.*'
  # release:
  #   types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Only run in the upstream repository, and only if tag matches v*.*.* pattern (not ts-v*.*.*)
    if: >
      github.repository == 'supreme-gg-gg/instagram-cli' && (
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/ts-v')) ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'ts-v')))

    environment:
      name: pypi-release

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            instagram-py/pyproject.toml
            instagram-py/uv.lock
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Build
        working-directory: instagram-py
        run: uv build
      # Credentials are not needed due to trusted publisher setting
      - name: Publish
        working-directory: instagram-py
        run: uv publish
