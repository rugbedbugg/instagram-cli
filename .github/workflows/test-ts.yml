name: Typescript Preflight

# Only triggers on changes to the TypeScript codebase
on:
  push:
    branches:
      - main
    paths:
      [
        '**/*.md',
        'source/**',
        'tests/**',
        'patches/**',
        'package.json',
        'package-lock.json',
        'tsconfig.json',
        'esbuild.config.mjs',
        'xo.config.ts',
        '.prettierignore',
        '.github/workflows/test-ts.yml',
      ]
  pull_request:
    branches:
      - main
    paths:
      [
        '**/*.md',
        'source/**',
        'tests/**',
        'patches/**',
        'package.json',
        'package-lock.json',
        'tsconfig.json',
        'esbuild.config.mjs',
        'xo.config.ts',
        '.prettierignore',
        '.github/workflows/test-ts.yml',
      ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines.node >=22: test the minimum supported LTS and the current LTS
        node-version: ['22', '24']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run lint and test
        run: npm run test
